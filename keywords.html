<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الكلمات المفتاحية - مكتبة الصوتيات الإسلامية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="pb-10">

    <!-- Header -->
    <header class="bg-emerald-700 text-white shadow-lg p-4 mb-8">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="index.html" class="hover:text-emerald-200 transition flex items-center gap-2">
                    <i class="fas fa-arrow-right"></i>
                    العودة للرئيسية
                </a>
                <h1 class="text-2xl font-bold mr-4">إدارة الكلمات المفتاحية</h1>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- Authors Keywords Section -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex items-center gap-3 mb-6 text-emerald-700">
                    <i class="fas fa-user-tie text-2xl"></i>
                    <h2 class="text-xl font-bold">الكلمات المفتاحية للمؤلفين</h2>
                </div>
                
                <div class="flex gap-2 mb-6">
                    <input type="text" id="authorInput" 
                        class="flex-1 p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-400" 
                        placeholder="أضف مؤلف جديد...">
                    <button id="addAuthorBtn" class="bg-emerald-600 text-white px-6 py-3 rounded-lg hover:bg-emerald-700 transition font-bold">
                        إضافة
                    </button>
                </div>

                <ul id="authorList" class="space-y-3">
                    <!-- Authors will be listed here -->
                </ul>
            </section>

            <!-- Titles Keywords Section -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex items-center gap-3 mb-6 text-emerald-700">
                    <i class="fas fa-book-open text-2xl"></i>
                    <h2 class="text-xl font-bold">الكلمات المفتاحية للعناوين</h2>
                </div>
                
                <div class="flex gap-2 mb-6">
                    <input type="text" id="titleInput" 
                        class="flex-1 p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-400" 
                        placeholder="أضف كلمة مفتاحية للعنوان...">
                    <button id="addTitleBtn" class="bg-emerald-600 text-white px-6 py-3 rounded-lg hover:bg-emerald-700 transition font-bold">
                        إضافة
                    </button>
                </div>

                <ul id="titleList" class="space-y-3">
                    <!-- Titles will be listed here -->
                </ul>
            </section>

        </div>
    </main>

    <script>
        // State Management
        const STORAGE_KEYS = {
            AUTHORS: 'islamic_keywords_authors',
            TITLES: 'islamic_keywords_titles'
        };

        let authors = JSON.parse(localStorage.getItem(STORAGE_KEYS.AUTHORS) || '[]');
        let titles = JSON.parse(localStorage.getItem(STORAGE_KEYS.TITLES) || '[]');

        // DOM Elements
        const authorInput = document.getElementById('authorInput');
        const addAuthorBtn = document.getElementById('addAuthorBtn');
        const authorList = document.getElementById('authorList');

        const titleInput = document.getElementById('titleInput');
        const addTitleBtn = document.getElementById('addTitleBtn');
        const titleList = document.getElementById('titleList');

        // Generic functions for CRUD
        function saveAndRender() {
            localStorage.setItem(STORAGE_KEYS.AUTHORS, JSON.stringify(authors));
            localStorage.setItem(STORAGE_KEYS.TITLES, JSON.stringify(titles));
            renderList(authorList, authors, 'author');
            renderList(titleList, titles, 'title');
        }

        function renderList(listElement, data, type) {
            listElement.innerHTML = '';
            if (data.length === 0) {
                listElement.innerHTML = '<p class="text-center text-gray-400 py-4 italic">لا توجد كلمات مفتاحية مضافة</p>';
                return;
            }

            data.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-200 hover:bg-gray-100 transition group';
                li.innerHTML = `
                    <span class="text-gray-700 font-medium truncate">${item}</span>
                    <div class="flex items-center gap-2">
                        <button onclick="editItem('${type}', ${index})" class="text-blue-500 hover:text-blue-700 p-2 rounded-md hover:bg-blue-100 transition" title="تعديل">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="deleteItem('${type}', ${index})" class="text-red-500 hover:text-red-700 p-2 rounded-md hover:bg-red-100 transition" title="حذف">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                listElement.appendChild(li);
            });
        }

        window.deleteItem = function(type, index) {
            if (confirm('هل أنت متأكد من حذف هذه الكلمة؟')) {
                if (type === 'author') authors.splice(index, 1);
                else titles.splice(index, 1);
                saveAndRender();
            }
        };

        window.editItem = function(type, index) {
            const currentList = type === 'author' ? authors : titles;
            const newValue = prompt('تعديل الكلمة المفتاحية:', currentList[index]);
            if (newValue !== null && newValue.trim() !== '') {
                currentList[index] = newValue.trim();
                saveAndRender();
            }
        };

        // Event Listeners
        addAuthorBtn.addEventListener('click', () => {
            const val = authorInput.value.trim();
            if (val) {
                authors.push(val);
                authorInput.value = '';
                saveAndRender();
            }
        });

        addTitleBtn.addEventListener('click', () => {
            const val = titleInput.value.trim();
            if (val) {
                titles.push(val);
                titleInput.value = '';
                saveAndRender();
            }
        });

        authorInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') addAuthorBtn.click(); });
        titleInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') addTitleBtn.click(); });

        // Initial Render
        saveAndRender();
    </script>
</body>
</html>
